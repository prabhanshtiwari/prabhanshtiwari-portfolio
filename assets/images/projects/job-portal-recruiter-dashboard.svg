<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Illustrative Job Portal recruiter dashboard</title><desc id="desc">A concept preview of a recruiter job management dashboard. This is not a captured application screenshot.</desc><rect width="1200" height="750" fill="#edf1ec"/><rect x="42" y="38" width="1116" height="674" rx="24" fill="#fbfcfa" stroke="#d2ddd4"/><rect x="42" y="38" width="1116" height="72" rx="24" fill="#20382c"/><rect x="42" y="86" width="1116" height="24" fill="#20382c"/><circle cx="88" cy="74" r="15" fill="#b9d6be"/><text x="118" y="82" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">CareerBoard</text><text x="1000" y="80" fill="#dce8de" font-family="Arial,sans-serif" font-size="16">Recruiter workspace</text><text x="90" y="166" fill="#20382c" font-family="Arial,sans-serif" font-size="34" font-weight="700">Manage your openings</text><text x="90" y="198" fill="#647469" font-family="Arial,sans-serif" font-size="17">Review job posts and applicant activity in one place.</text><rect x="90" y="232" width="1020" height="66" rx="13" fill="#e8f0e8"/><text x="120" y="272" fill="#20382c" font-family="Arial,sans-serif" font-size="19" font-weight="700">Posted roles</text><rect x="955" y="248" width="125" height="34" rx="17" fill="#315e49"/><text x="984" y="271" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">+ Add job</text><g font-family="Arial,sans-serif"><rect x="90" y="326" width="1020" height="83" rx="12" fill="#fff" stroke="#dce4dc"/><text x="120" y="359" fill="#24372b" font-size="18" font-weight="700">Frontend Developer</text><text x="120" y="384" fill="#718075" font-size="14">Full-time · Remote · Sample listing</text><text x="790" y="373" fill="#52685a" font-size="14">12 applicants</text><rect x="958" y="347" width="116" height="36" rx="18" fill="#e8f0e8"/><text x="989" y="371" fill="#315e49" font-size="13" font-weight="700">Open</text><rect x="90" y="424" width="1020" height="83" rx="12" fill="#fff" stroke="#dce4dc"/><text x="120" y="457" fill="#24372b" font-size="18" font-weight="700">Junior Backend Developer</text><text x="120" y="482" fill="#718075" font-size="14">Full-time · Hybrid · Sample listing</text><text x="790" y="471" fill="#52685a" font-size="14">07 applicants</text><rect x="958" y="445" width="116" height="36" rx="18" fill="#e8f0e8"/><text x="989" y="469" fill="#315e49" font-size="13" font-weight="700">Open</text><rect x="90" y="522" width="1020" height="83" rx="12" fill="#fff" stroke="#dce4dc"/><text x="120" y="555" fill="#24372b" font-size="18" font-weight="700">UI Developer Intern</text><text x="120" y="580" fill="#718075" font-size="14">Internship · On-site · Sample listing</text><text x="790" y="569" fill="#52685a" font-size="14">04 applicants</text><rect x="958" y="543" width="116" height="36" rx="18" fill="#f4eee1"/><text x="987" y="567" fill="#75644a" font-size="13" font-weight="700">Draft</text><text x="90" y="650" fill="#718075" font-size="14">Illustrative workflow preview · Sample data only</text></g></svg>